name: Radar 24/7 Sync

on:
  schedule:
    # Запуск кожні 5 годин 40 хвилин (перекриває 6-годинний ліміт GitHub)
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: radar-runner
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Клонування репозиторію
        uses: actions/checkout@v4

      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Встановлення залежностей
        run: |
          python -m pip install --upgrade pip
          pip install requests telethon

      - name: Запуск радара
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python radar.py

      - name: Автоматичний перезапуск наступної зміни
        if: always()
        run: |
          echo "Зміна завершена. Наступний цикл підхопить cron або workflow_dispatch."
