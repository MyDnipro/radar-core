name: Radar 24/7 Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: radar-runner
  cancel-in-progress: true

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read

    steps:
      - name: Клонування репозиторію
        uses: actions/checkout@v4

      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Встановлення бібліотек
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Запуск радара
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: python radar.py

      - name: Автоматичний перезапуск наступної зміни
        if: always()
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/MyDnipro/radar-core/actions/workflows/radar.yml/dispatches \
            -d '{"ref":"main"}'
