name: Radar 24/7 Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: radar-runner
  cancel-in-progress: true

# ДОБАВЛЕНО: Даем права скрипту нажимать кнопку запуска
permissions:
  actions: write
  contents: read

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Клонування репозиторію
        uses: actions/checkout@v4

      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Встановлення бібліотек
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Запуск радара
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          # ДОБАВЛЕНО: Передаем токен внутрь скрипта
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python radar.py
