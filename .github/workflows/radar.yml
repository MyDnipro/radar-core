name: Radar 24/7 Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '10 */5 * * *'

concurrency:
  group: radar-runner
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Клонування репозиторію
        uses: actions/checkout@v4

      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Встановлення бібліотек
        run: |
          python -m pip install --upgrade pip
          pip install requests telethon

      - name: Запуск радара
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python radar.py

      - name: Автоматичний перезапуск наступної зміни
        if: always()
        run: |
          echo "Зміна завершена."
